name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (vMAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: write
  checks: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Validate version and CI
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo '::error::Version must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          checks=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --jq '[.check_runs[] | select(.name == "test")]')
          if ! printf '%s' "$checks" | jq -e 'length > 0 and all(.[]; .status == "completed" and .conclusion == "success")' >/dev/null; then
            echo '::error::The test check must succeed for the release commit.' >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the distributed bundle
        run: bun run check:dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${VERSION}" -f "sha=${GITHUB_SHA}" >/dev/null
          verify_tag() {
            actual=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" --jq '.object.sha')
            if [ "$actual" != "$GITHUB_SHA" ]; then
              echo '::error::The release tag does not point to the verified commit.' >&2
              exit 1
            fi
          }
          verify_tag
          gh release create "$VERSION" --verify-tag --generate-notes
          verify_tag
